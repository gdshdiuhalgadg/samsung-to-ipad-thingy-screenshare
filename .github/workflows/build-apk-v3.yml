name: Build GalaxyPad APK v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GalaxyPad-WebRTC-v1.1.zip -d buildsrc
          ls -la buildsrc/GalaxyPad-WebRTC-v1.1

      - name: Build APK
        working-directory: buildsrc/GalaxyPad-WebRTC-v1.1
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find buildsrc -name "*.apk" -type f
          cp buildsrc/GalaxyPad-WebRTC-v1.1/app/build/outputs/apk/debug/app-debug.apk GalaxyPad-WebRTC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPad-WebRTC-APK
          path: GalaxyPad-WebRTC.apk
