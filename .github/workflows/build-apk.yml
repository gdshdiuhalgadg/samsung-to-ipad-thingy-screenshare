name: Build GalaxyPad APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip GalaxyPad source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GalaxyPad-WebRTC-v1.1.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/GalaxyPad-WebRTC-v1.1
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: cp buildsrc/GalaxyPad-WebRTC-v1.1/app/build/outputs/apk/debug/app-debug.apk GalaxyPad-WebRTC-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPad-WebRTC-debug
          path: GalaxyPad-WebRTC-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest GalaxyPad-WebRTC-debug.apk --clobber
          else
            gh release create latest GalaxyPad-WebRTC-debug.apk \
              --title "GalaxyPad WebRTC APK" \
              --notes "Debug APK built automatically from GalaxyPad-WebRTC-v1.1.zip"
          fi
