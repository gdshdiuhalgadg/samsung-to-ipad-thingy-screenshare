name: Build GalaxyPad APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip GalaxyPad source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GalaxyPad-WebRTC-v1.1.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/GalaxyPad-WebRTC-v1.1
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: |
          cp buildsrc/GalaxyPad-WebRTC-v1.1/app/build/outputs/apk/debug/app-debug.apk GalaxyPad-WebRTC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPad-WebRTC
          path: GalaxyPad-WebRTC.apk

      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete galaxypad-latest --yes || true
          git push origin :refs/tags/galaxypad-latest || true
          gh release create galaxypad-latest GalaxyPad-WebRTC.apk \
            --title "GalaxyPad WebRTC APK" \
            --notes "Samsung to iPad low-latency WebRTC test build."
